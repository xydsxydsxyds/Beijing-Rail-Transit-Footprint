name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate network data
        run: npm run validate:data -- --network data/network.json --json

      - name: Validate diagram hotspots
        run: npm run validate:hotspots

      - name: Validate line manifest
        run: npm run validate:manifest

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/data _site/src _site/assets

          cp index.html _site/
          cp notices.html _site/
          cp THIRD_PARTY_NOTICES.md _site/

          cp -R src/. _site/src/
          cp -R assets/. _site/assets/

          cp data/network.json _site/data/
          cp data/diagram-hotspots.json _site/data/

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
